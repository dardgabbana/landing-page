<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodia.Media — Video FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Geist',sans-serif;
            background:radial-gradient(ellipse at 50% 15%,#bef264 0%,#a3e635 30%,#84cc16 60%,#65a30d 100%);
            color:#fff;overflow-x:hidden;min-height:100vh;
        }
        /* Reptile scale pattern overlay */
        body::before{
            content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.04;
            background-image:
                radial-gradient(ellipse 18px 14px at 50% 50%, rgba(0,0,0,0.5) 0%, transparent 70%),
                radial-gradient(ellipse 18px 14px at 0% 100%, rgba(0,0,0,0.5) 0%, transparent 70%),
                radial-gradient(ellipse 18px 14px at 100% 100%, rgba(0,0,0,0.5) 0%, transparent 70%);
            background-size:36px 32px;
        }
        /* Noise */
        body::after{
            content:'';position:fixed;inset:0;opacity:0.03;pointer-events:none;z-index:0;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ─── CHAMELEON ─── */
        .cham-wrap{position:relative;width:380px;height:500px;flex-shrink:0}
        .cham-glow{
            position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
            width:340px;height:360px;border-radius:50%;
            background:radial-gradient(circle,rgba(21,128,61,0.2) 0%,transparent 70%);
            filter:blur(40px);animation:chamBreathe 4s ease-in-out infinite;
        }
        @keyframes chamBreathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}

        .cham-body{
            position:absolute;bottom:55px;left:50%;transform:translateX(-50%);
            width:290px;height:330px;
            background:linear-gradient(160deg,#166534 0%,#15803d 20%,#166534 40%,#14532d 65%,#052e16 100%);
            border-radius:46% 46% 42% 42%/50% 50% 45% 45%;
            box-shadow:0 0 50px rgba(22,101,52,0.35),inset 0 -30px 50px rgba(0,0,0,0.3),inset 0 15px 35px rgba(74,222,128,0.1);
            animation:chamBodyBreathe 4s ease-in-out infinite;
        }
        @keyframes chamBodyBreathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.01)}}

        /* Spots */
        .cham-spot{position:absolute;border-radius:50%;background:rgba(5,46,22,0.5);box-shadow:inset 0 2px 4px rgba(0,0,0,0.2)}
        .cham-spot.s1{width:20px;height:20px;top:10%;left:10%}
        .cham-spot.s2{width:16px;height:16px;top:26%;right:8%}
        .cham-spot.s3{width:22px;height:22px;bottom:20%;left:15%}
        .cham-spot.s4{width:13px;height:13px;top:16%;left:42%}
        .cham-spot.s5{width:18px;height:18px;bottom:28%;right:12%}
        .cham-spot.s6{width:12px;height:12px;top:40%;left:6%}
        .cham-spot.s7{width:14px;height:14px;bottom:14%;left:40%}

        .cham-ridge{position:absolute;top:-5px;left:15%;width:70%;height:12px;background:linear-gradient(90deg,transparent,rgba(74,222,128,0.2),transparent);border-radius:50%;filter:blur(2px)}

        /* Crest / casque on top of head */
        .cham-crest{
            position:absolute;top:-22px;left:30px;width:0;height:0;
            border-left:18px solid transparent;border-right:18px solid transparent;
            border-bottom:28px solid #166534;filter:drop-shadow(0 -4px 6px rgba(22,101,52,0.3));
        }

        /* TV Screen inside body */
        .cham-tv{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            width:230px;height:150px;border-radius:14px;overflow:hidden;cursor:pointer;
            border:3px solid #15803d;
            box-shadow:0 0 20px rgba(22,101,52,0.4),inset 0 0 20px rgba(0,0,0,0.5),
                        4px 4px 0 #14532d, 4px 4px 0 #052e16;
            transition:border-color .3s,box-shadow .3s;
        }
        .cham-tv:hover{border-color:#22c55e;box-shadow:0 0 30px rgba(34,197,94,0.5),inset 0 0 20px rgba(0,0,0,0.5),4px 4px 0 #14532d,4px 4px 0 #052e16}
        .cham-tv img{width:100%;height:100%;object-fit:cover;filter:brightness(.65) saturate(1.2);transition:filter .3s}
        .cham-tv:hover img{filter:brightness(.8) saturate(1.3)}
        .cham-tv-overlay{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.3);transition:background .3s;
        }
        .cham-tv:hover .cham-tv-overlay{background:rgba(0,0,0,0.12)}
        .cham-tv-play{
            width:50px;height:50px;border-radius:50%;background:rgba(163,230,53,0.9);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 0 22px rgba(163,230,53,0.5);transition:transform .3s;
        }
        .cham-tv:hover .cham-tv-play{transform:scale(1.12)}
        .cham-tv-play svg{color:#052e16;margin-left:2px}

        /* TV antenna */
        .cham-antenna{
            position:absolute;top:-30px;left:50%;transform:translateX(-50%);
            width:2px;height:28px;background:#15803d;
        }
        .cham-antenna::before{
            content:'';position:absolute;top:-5px;left:-4px;
            width:10px;height:10px;border-radius:50%;
            background:radial-gradient(circle at 40% 35%,#a3e635,#65a30d);
            box-shadow:0 0 8px rgba(163,230,53,0.6);
            animation:antennaGlow 2s ease-in-out infinite alternate;
        }
        @keyframes antennaGlow{0%{box-shadow:0 0 6px rgba(163,230,53,0.4)}100%{box-shadow:0 0 14px rgba(163,230,53,0.8)}}

        /* Mouth */
        .cham-mouth{position:absolute;bottom:65px;left:60px;width:45px;height:12px;border-bottom:3px solid rgba(5,46,22,0.6);border-radius:0 0 50% 50%}

        /* Eye */
        .cham-eye-wrap{position:absolute;top:-16px;left:50px;z-index:10}
        .cham-eye-socket{
            width:72px;height:72px;border-radius:50%;
            background:radial-gradient(circle at 40% 40%,#14532d,#052e16);
            box-shadow:0 0 22px rgba(22,101,52,0.5),inset 0 2px 6px rgba(0,0,0,0.5);
            display:flex;align-items:center;justify-content:center;
        }
        .cham-eye-ball{
            width:56px;height:56px;border-radius:50%;
            background:radial-gradient(circle at 38% 35%,#fde68a,#f59e0b 40%,#d97706 70%,#92400e);
            box-shadow:inset 0 2px 8px rgba(0,0,0,0.3);
            position:relative;overflow:hidden;
        }
        .cham-pupil{
            position:absolute;width:13px;height:32px;background:#000;border-radius:50%;
            top:50%;left:50%;transform:translate(-50%,-50%);
            transition:transform .08s ease-out;box-shadow:0 0 4px rgba(0,0,0,0.5);
        }
        .cham-eye-shine{position:absolute;top:8px;left:13px;width:10px;height:10px;background:rgba(255,255,255,0.9);border-radius:50%;pointer-events:none}
        .cham-eye-shine-sm{position:absolute;bottom:13px;right:13px;width:5px;height:5px;background:rgba(255,255,255,0.35);border-radius:50%;pointer-events:none}

        /* Tail */
        .cham-tail{position:absolute;bottom:75px;right:-14px;width:85px;height:105px;filter:drop-shadow(0 0 8px rgba(22,101,52,0.3))}

        /* Legs */
        .cham-leg{position:absolute;bottom:35px;width:24px;height:42px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,#166534,#14532d);box-shadow:0 4px 10px rgba(0,0,0,0.3)}
        .cham-leg.fl{left:80px;transform:rotate(5deg)}
        .cham-leg.fr{left:112px;transform:rotate(-3deg);background:linear-gradient(180deg,#15803d,#166534)}
        .cham-leg.bl{right:88px;transform:rotate(-5deg)}
        .cham-leg.br{right:118px;transform:rotate(3deg);background:linear-gradient(180deg,#15803d,#166534)}
        .cham-toes{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
        .cham-toe{width:6px;height:7px;background:#14532d;border-radius:0 0 3px 3px}

        /* ─── PLAYLIST ─── */
        .playlist-scroll{flex:1;overflow-y:auto;padding-right:6px}
        .playlist-scroll::-webkit-scrollbar{width:4px}
        .playlist-scroll::-webkit-scrollbar-track{background:transparent}
        .playlist-scroll::-webkit-scrollbar-thumb{background:rgba(22,101,52,0.25);border-radius:4px}
        .playlist-item{
            display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;
            transition:all .25s;border-left:3px solid transparent;margin-bottom:3px;
            animation:plFade .4s ease-out backwards;
            background:rgba(2,6,23,0.75);backdrop-filter:blur(4px);
        }
        .playlist-item:hover{background:rgba(2,6,23,0.88)!important;transform:translateX(4px)}
        .playlist-item.active{border-left-color:#a3e635;background:rgba(2,6,23,0.9)!important}
        @keyframes plFade{from{opacity:0;transform:translateX(-15px)}to{opacity:1;transform:translateX(0)}}
        .pl-thumb{position:relative;width:110px;height:62px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#0f172a}
        .pl-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
        .playlist-item:hover .pl-thumb img{transform:scale(1.08)}

        /* ─── MODAL ─── */
        .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.88);backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
        .modal-backdrop.open{opacity:1;visibility:visible}
        .modal-content{position:fixed;z-index:101;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.92);width:92%;max-width:900px;opacity:0;visibility:hidden;transition:opacity .35s ease,transform .35s ease,visibility .35s}
        .modal-content.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
        .modal-close{position:absolute;top:-14px;right:-14px;width:38px;height:38px;border-radius:50%;background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:all .2s}
        .modal-close:hover{background:rgba(30,41,59,1);transform:scale(1.1)}

        /* ─── NAV ─── */
        .nav-link{position:relative}
        .nav-link::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:#a3e635;transition:width .3s}
        .nav-link:hover::after{width:100%}

        /* Film strip */
        @keyframes scrollFilm{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        .film-scroll{display:flex;gap:8px;animation:scrollFilm 30s linear infinite}
        .film-frame{width:44px;height:28px;border-radius:4px;flex-shrink:0;background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.05)}

        /* Toast */
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(2,6,23,0.92);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;z-index:200;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,0.3);border:1px solid rgba(163,230,53,0.2);backdrop-filter:blur(8px)}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        /* Floating eye decorations */
        .deco-eye{
            position:absolute;border-radius:50%;opacity:0.07;pointer-events:none;
            background:radial-gradient(circle at 40% 35%,#fde68a,#d97706 50%,#92400e);
        }

        /* ─── RESPONSIVE ─── */
        @media(max-width:950px){
            .player-section{flex-direction:column!important;align-items:center!important}
            .cham-wrap{width:300px;height:400px}
            .cham-body{width:230px;height:265px}
            .cham-tv{width:185px;height:120px}
            .cham-eye-wrap{top:-12px;left:38px}
            .cham-eye-socket{width:58px;height:58px}
            .cham-eye-ball{width:46px;height:46px}
            .cham-pupil{width:11px;height:26px}
            .cham-leg{height:34px;width:20px}
            .cham-tail{width:65px;height:80px;bottom:58px;right:-10px}
            .cham-mouth{bottom:52px;left:48px}
            .playlist-container{max-width:100%;width:100%;max-height:380px}
            .pl-thumb{width:90px;height:50px}
            .cham-crest{top:-18px;left:24px;border-left-width:14px;border-right-width:14px;border-bottom-width:22px}
        }
        @media(max-width:500px){
            .cham-wrap{width:260px;height:350px}
            .cham-body{width:200px;height:230px}
            .cham-tv{width:160px;height:105px;border-width:2px}
            .pl-thumb{width:75px;height:42px}
        }

        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
    </style>
</head>
<body>

<!-- Floating decorative eyes -->
<div class="deco-eye" style="width:60px;height:60px;top:12%;left:5%;"></div>
<div class="deco-eye" style="width:40px;height:40px;top:25%;right:8%;"></div>
<div class="deco-eye" style="width:50px;height:50px;bottom:15%;left:10%;"></div>
<div class="deco-eye" style="width:35px;height:35px;bottom:30%;right:5%;"></div>
<div class="deco-eye" style="width:45px;height:45px;top:60%;left:3%;"></div>

<!-- NAVIGATION -->
<nav class="fixed top-0 left-0 right-0 z-50 h-16" style="background:rgba(2,6,23,0.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);">
    <div class="max-w-7xl mx-auto h-full px-6 flex items-center justify-between">
        <a href="#" class="flex items-center gap-3 group">
            <div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center p-1.5 transition-transform group-hover:scale-105">
                <img src="logo.png" alt="Exodia" class="w-full h-full object-contain">
            </div>
            <span class="text-white font-semibold tracking-tight text-lg">Exodia<span class="text-lime-400">.Media</span></span>
        </a>
        <div class="hidden md:flex items-center gap-8">
            <a href="#" class="nav-link text-sm text-slate-400 hover:text-white transition-colors">Work</a>
            <a href="#" class="nav-link text-sm text-slate-400 hover:text-white transition-colors">About</a>
            <a href="#" class="nav-link text-sm text-slate-400 hover:text-white transition-colors">Services</a>
            <a href="#" class="nav-link text-sm text-slate-400 hover:text-white transition-colors">Contact</a>
            <a href="#" class="text-sm font-semibold px-5 py-2 rounded-full bg-lime-500 text-slate-950 hover:bg-lime-400 transition-colors">Hire Us</a>
        </div>
        <button class="md:hidden text-slate-400 hover:text-white" onclick="showToast('Mobile menu — coming soon')">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
    </div>
</nav>

<!-- MAIN -->
<main class="relative z-10 pt-28 sm:pt-32 pb-6 px-4 sm:px-6">

    <!-- Hero text -->
    <div class="text-center mb-8 max-w-2xl mx-auto">
        <div class="w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-5 bg-white rounded-xl p-2 shadow-lg shadow-black/10">
            <img src="logo.png" alt="Exodia.Media" class="w-full h-full object-contain">
        </div>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tighter leading-[1.08]"
            style="text-shadow:0 2px 30px rgba(0,0,0,0.1);">
            <span class="text-white">Visual Direction</span><br>
            <span class="text-slate-950">Music Video Edits</span>
        </h1>
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full mt-4" style="background:rgba(2,6,23,0.8);backdrop-filter:blur(8px);">
            <i data-lucide="flame" class="w-3.5 h-3.5 text-lime-400"></i>
            <span class="text-xs sm:text-sm font-semibold text-white">Exodia FX Videos</span>
        </div>
        <p class="text-xs sm:text-sm mt-3 max-w-sm mx-auto leading-relaxed" style="color:rgba(255,255,255,0.6);text-shadow:0 1px 6px rgba(0,0,0,0.08);">
            Moving filmstrip portfolio inspired by editorial studio presentation.
        </p>
    </div>

    <!-- Film strip -->
    <div class="overflow-hidden py-4 mb-6 relative z-10 opacity-25">
        <div class="film-scroll" id="filmStrip"></div>
    </div>

    <!-- Player Section -->
    <div class="player-section flex items-start justify-center gap-8 lg:gap-10 max-w-5xl mx-auto">

        <!-- Chameleon -->
        <div class="cham-wrap">
            <div class="cham-glow"></div>
            <div class="cham-body">
                <div class="cham-crest"></div>
                <div class="cham-ridge"></div>
                <div class="cham-spot s1"></div>
                <div class="cham-spot s2"></div>
                <div class="cham-spot s3"></div>
                <div class="cham-spot s4"></div>
                <div class="cham-spot s5"></div>
                <div class="cham-spot s6"></div>
                <div class="cham-spot s7"></div>

                <!-- TV Screen -->
                <div class="cham-antenna"></div>
                <div class="cham-tv" id="chamTV" onclick="openModal()">
                    <img id="featuredImg" src="" alt="Featured Video">
                    <div class="cham-tv-overlay">
                        <div class="cham-tv-play">
                            <i data-lucide="play" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

                <div class="cham-mouth"></div>

                <!-- Legs -->
                <div class="cham-leg fl"><div class="cham-toes"><div class="cham-toe"></div><div class="cham-toe"></div></div></div>
                <div class="cham-leg fr"><div class="cham-toes"><div class="cham-toe"></div><div class="cham-toe"></div></div></div>
                <div class="cham-leg bl"><div class="cham-toes"><div class="cham-toe"></div><div class="cham-toe"></div></div></div>
                <div class="cham-leg br"><div class="cham-toes"><div class="cham-toe"></div><div class="cham-toe"></div></div></div>
            </div>

            <!-- Eye -->
            <div class="cham-eye-wrap">
                <div class="cham-eye-socket">
                    <div class="cham-eye-ball" id="chamEyeBall">
                        <div class="cham-pupil" id="chamPupil"></div>
                        <div class="cham-eye-shine"></div>
                        <div class="cham-eye-shine-sm"></div>
                    </div>
                </div>
            </div>

            <!-- Tail -->
            <svg class="cham-tail" viewBox="0 0 120 140" fill="none">
                <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#166534"/><stop offset="100%" stop-color="#052e16"/></linearGradient></defs>
                <path d="M 15 130 Q 65 115, 85 70 Q 100 35, 75 15 Q 55 0, 45 20 Q 38 38, 58 40 Q 72 42, 70 25" stroke="url(#tg)" stroke-width="20" stroke-linecap="round" fill="none"/>
                <path d="M 15 130 Q 65 115, 85 70 Q 100 35, 75 15 Q 55 0, 45 20 Q 38 38, 58 40 Q 72 42, 70 25" stroke="rgba(74,222,128,0.12)" stroke-width="24" stroke-linecap="round" fill="none" style="filter:blur(4px)"/>
            </svg>

            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 text-[10px] text-slate-950/30 font-medium tracking-widest uppercase whitespace-nowrap">▲ now showing</div>
        </div>

        <!-- Playlist -->
        <div class="playlist-container flex flex-col" style="max-width:420px;min-width:0;max-height:500px;">
            <div class="flex items-center justify-between mb-3 px-1">
                <div class="flex items-center gap-2">
                    <i data-lucide="list-video" class="w-4 h-4 text-slate-950/40"></i>
                    <span class="text-sm font-bold text-slate-950/70">Playlist</span>
                    <span class="text-xs text-slate-950/35" id="plCount">—</span>
                </div>
                <button onclick="shufflePlaylist()" class="text-xs font-medium flex items-center gap-1 transition-colors" style="color:rgba(15,23,42,0.35);" onmouseover="this.style.color='rgba(15,23,42,0.75)'" onmouseout="this.style.color='rgba(15,23,42,0.35)'">
                    <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> Shuffle
                </button>
            </div>
            <div class="playlist-scroll" id="playlistScroll"></div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="relative z-10 text-center pb-10 px-6">
    <p class="text-[10px] tracking-[0.2em] uppercase font-medium" style="color:rgba(15,23,42,0.25);">Exodia.Media — Every Pixel Intentional</p>
</footer>

<!-- YOUTUBE MODAL -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
<div class="modal-content" id="modalContent">
    <button class="modal-close" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4 text-slate-400"></i></button>
    <div class="rounded-2xl overflow-hidden" style="background:rgba(2,6,23,0.95);border:1px solid rgba(255,255,255,0.06);box-shadow:0 30px 80px rgba(0,0,0,0.5);">
        <div class="aspect-video bg-black">
            <iframe id="ytIframe" class="w-full h-full" frameborder="0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="p-5 sm:p-6">
            <h3 class="text-base sm:text-lg font-semibold" id="modalTitle">—</h3>
            <p class="text-sm text-slate-400 mt-1" id="modalSub">—</p>
            <div class="flex flex-wrap gap-4 mt-3 text-xs text-slate-500">
                <span class="flex items-center gap-1"><i data-lucide="tv" class="w-3 h-3"></i> Exodia FX</span>
                <span class="flex items-center gap-1"><i data-lucide="globe" class="w-3 h-3"></i> youtube.com</span>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Your 6 videos
const videos=[
    {title:"Exodia FX — Reel 01",subtitle:"Visual direction & music video edit",youtubeId:"U6B3c6Jl40k"},
    {title:"Exodia FX — Reel 02",subtitle:"Visual direction & music video edit",youtubeId:"SRfLLCofI4Y"},
    {title:"Exodia FX — Reel 03",subtitle:"Visual direction & music video edit",youtubeId:"NRe9i5Ety6Y"},
    {title:"Exodia FX — Reel 04",subtitle:"Visual direction & music video edit",youtubeId:"Uh3pLYM27Pc"},
    {title:"Exodia FX — Reel 05",subtitle:"Visual direction & music video edit",youtubeId:"mYbYIrgRe9M"},
    {title:"Exodia FX — Reel 06",subtitle:"Visual direction & music video edit",youtubeId:"YUolkdzYtxw"}
];

let currentIndex=0;

function thumb(id){return`https://img.youtube.com/vi/${id}/hqdefault.jpg`}

// Auto-fetch real titles
async function fetchInfo(id,i){
    try{
        const r=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        const d=await r.json();
        if(d.title){videos[i].title=d.title;videos[i].subtitle=d.author_name||''}
        if(i===0&&!window._done){window._done=true;renderPlaylist();selectVideo(0)}
    }catch(e){}
}

function renderPlaylist(){
    const c=document.getElementById('playlistScroll');c.innerHTML='';
    document.getElementById('plCount').textContent=videos.length+' videos';
    videos.forEach((v,i)=>{
        const el=document.createElement('div');
        el.className=`playlist-item${i===currentIndex?' active':''}`;
        el.style.animationDelay=`${i*0.06}s`;
        el.onclick=()=>selectVideo(i);
        el.innerHTML=`
            <div class="pl-thumb"><img src="${thumb(v.youtubeId)}" alt="${v.title}" loading="lazy"></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
                <div style="font-size:13px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3">${v.title}</div>
                <div style="font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.subtitle}</div>
                <div style="font-size:10px;color:#64748b;margin-top:3px">Exodia.Media</div>
            </div>`;
        c.appendChild(el);
    });
}

function selectVideo(i){
    currentIndex=i;const v=videos[i];
    document.getElementById('featuredImg').src=thumb(v.youtubeId);
    document.querySelectorAll('.playlist-item').forEach((el,j)=>el.classList.toggle('active',j===i));
    const a=document.querySelectorAll('.playlist-item')[i];
    if(a)a.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openModal(){
    const v=videos[currentIndex];
    document.getElementById('ytIframe').src=`https://www.youtube.com/embed/${v.youtubeId}?autoplay=1&rel=0&modestbranding=1`;
    document.getElementById('modalTitle').textContent=v.title;
    document.getElementById('modalSub').textContent=v.subtitle;
    document.getElementById('modalBackdrop').classList.add('open');
    document.getElementById('modalContent').classList.add('open');
    document.body.style.overflow='hidden';
}

function closeModal(){
    document.getElementById('ytIframe').src='';
    document.getElementById('modalBackdrop').classList.remove('open');
    document.getElementById('modalContent').classList.remove('open');
    document.body.style.overflow='';
}

function shufflePlaylist(){
    for(let i=videos.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[videos[i],videos[j]]=[videos[j],videos[i]]}
    currentIndex=0;renderPlaylist();selectVideo(0);showToast('Playlist shuffled 🎲');
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// Eye tracking
document.addEventListener('mousemove',e=>{
    const ball=document.getElementById('chamEyeBall'),pupil=document.getElementById('chamPupil');
    if(!ball||!pupil)return;
    const r=ball.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.sqrt(dx*dx+dy*dy),mx=8;
    const px=(dx/Math.max(d,1))*Math.min(d*0.04,mx),py=(dy/Math.max(d,1))*Math.min(d*0.04,mx);
    pupil.style.transform=`translate(calc(-50% + ${px}px),calc(-50% + ${py}px))`;
});

// Film strip
(function(){const s=document.getElementById('filmStrip');let h='';for(let r=0;r<2;r++)for(let i=0;i<40;i++)h+='<div class="film-frame"></div>';s.innerHTML=h})();

// Keyboard
document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeModal();
    if(!document.getElementById('modalBackdrop').classList.contains('open')){
        if(e.key==='ArrowDown'){e.preventDefault();selectVideo((currentIndex+1)%videos.length)}
        if(e.key==='ArrowUp'){e.preventDefault();selectVideo((currentIndex-1+videos.length)%videos.length)}
        if(e.key==='Enter')openModal();
    }
});

// Init
renderPlaylist();selectVideo(0);lucide.createIcons();
videos.forEach((v,i)=>fetchInfo(v.youtubeId,i));
</script>
</body>
</html>
