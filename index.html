<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0a0b;
    --card: #141416;
    --card-hover: #1a1a1e;
    --border: rgba(255,255,255,0.06);
    --fg: #f0f0f2;
    --muted: #7a7a85;
    --accent: #e8453c;
    --accent-glow: rgba(232,69,60,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -10%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, rgba(232,69,60,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 40vw;
    height: 40vw;
    background: radial-gradient(circle, rgba(255,180,60,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 2rem 2rem 0;
    text-align: center;
  }

  header h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
  }

  header p {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 300;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 2.5rem auto;
    padding: 0 1.5rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  .video-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .video-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px -15px rgba(0,0,0,0.5);
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    cursor: pointer;
    overflow: hidden;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }

  .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  .video-overlay:hover {
    background: rgba(0,0,0,0.08);
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.95;
    transition: transform 0.25s ease, opacity 0.25s ease;
    box-shadow: 0 4px 24px rgba(232,69,60,0.4);
    pointer-events: none;
  }

  .play-btn i {
    color: #fff;
    font-size: 1.2rem;
    margin-left: 3px;
    transition: margin 0.2s ease;
  }

  .video-overlay:hover .play-btn {
    transform: scale(1.1);
    opacity: 1;
  }

  .video-wrapper.playing .play-btn {
    opacity: 0;
    transform: scale(0.7);
    transition: all 0.3s ease;
  }

  .video-wrapper.playing .video-overlay:hover {
    background: rgba(0,0,0,0.15);
  }

  /* Show a subtle pause icon when hovering a playing video */
  .video-wrapper.playing .play-btn {
    opacity: 0;
  }
  .video-wrapper.playing .video-overlay:hover .play-btn {
    opacity: 0.9;
    transform: scale(1.1);
  }
  .video-wrapper.playing .play-btn i {
    margin-left: 0;
  }

  .video-wrapper::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .video-wrapper:not(.playing)::after {
    opacity: 1;
  }

  .video-info {
    padding: 1rem 1.2rem 1.2rem;
  }

  .video-info h3 {
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 0.35rem;
    color: var(--fg);
    cursor: default;
  }

  .video-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 300;
  }

  .video-meta span {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    font-size: 0.85rem;
    z-index: 9999;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 700px) {
    main {
      grid-template-columns: 1fr;
      padding: 0 1rem 3rem;
    }
    header { padding: 1.5rem 1rem 0; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .video-card {
    animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  .video-card:nth-child(2) { animation-delay: 0.08s; }
  .video-card:nth-child(3) { animation-delay: 0.16s; }
  .video-card:nth-child(4) { animation-delay: 0.24s; }
  .video-card:nth-child(5) { animation-delay: 0.32s; }
  .video-card:nth-child(6) { animation-delay: 0.40s; }
</style>
</head>
<body>

<header>
  <h1>Video Library</h1>
  <p>Watch exclusive content — available only here</p>
</header>

<main id="gallery"></main>

<div class="toast" id="toast"></div>

<!-- YouTube IFrame API (loaded once) -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  const videos = [
    {
      id: 'dQw4w9WgXcQ',
      title: 'Getting Started with the Platform',
      duration: '4:32',
      views: '1.2K views'
    },
    {
      id: 'jNQXAC9IVRw',
      title: 'Advanced Techniques Deep Dive',
      duration: '12:08',
      views: '890 views'
    },
    {
      id: '9bZkp7q19f0',
      title: 'Behind the Scenes Workflow',
      duration: '7:45',
      views: '2.1K views'
    },
    {
      id: 'kJQP7kiw5Fk',
      title: 'Tips for Better Results',
      duration: '6:19',
      views: '560 views'
    },
    {
      id: 'RgKAFK5djSk',
      title: 'Full Project Walkthrough',
      duration: '18:33',
      views: '3.4K views'
    },
    {
      id: 'OPf0YbXqDm0',
      title: 'Q&A Session Highlights',
      duration: '9:50',
      views: '1.8K views'
    }
  ];

  const gallery = document.getElementById('gallery');
  const toast = document.getElementById('toast');
  const players = {};

  // Build cards with placeholder divs for the API to replace
  videos.forEach((video, index) => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <div class="video-wrapper" data-index="${index}">
        <div id="player-${index}"></div>
        <div class="video-overlay">
          <div class="play-btn"><i class="fas fa-play"></i></div>
        </div>
      </div>
      <div class="video-info">
        <h3>${video.title}</h3>
        <div class="video-meta">
          <span><i class="far fa-clock"></i> ${video.duration}</span>
          <span><i class="far fa-eye"></i> ${video.views}</span>
        </div>
      </div>
    `;
    gallery.appendChild(card);
  });

  // YouTube IFrame API ready callback
  function onYouTubeIframeAPIReady() {
    videos.forEach((video, index) => {
      players[index] = new YT.Player(`player-${index}`, {
        videoId: video.id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          modestbranding: 1,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          controls: 0,
          fs: 0,
          disablekb: 1,
          playsinline: 1,
          autoplay: 0,
          cc_load_policy: 0,
          annotation_control: 'none'
        },
        events: {
          onReady: (event) => {
            // Once ready, ensure the iframe stays locked
            const iframe = document.querySelector(`#player-${index} iframe`);
            if (iframe) {
              iframe.style.pointerEvents = 'none';
            }
          },
          onStateChange: (event) => {
            const wrapper = document.querySelector(`.video-wrapper[data-index="${index}"]`);
            const playIcon = wrapper.querySelector('.play-btn i');
            // YT.PlayerState.PLAYING === 1, PAUSED === 2, ENDED === 0
            if (event.data === 1) {
              wrapper.classList.add('playing');
              playIcon.className = 'fas fa-pause';
            } else {
              wrapper.classList.remove('playing');
              playIcon.className = 'fas fa-play';
            }
          }
        }
      });
    });
  }

  // Click handler: toggle play/pause via API (never reloads, never enables pointer-events)
  document.querySelectorAll('.video-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      const wrapper = overlay.closest('.video-wrapper');
      const index = wrapper.dataset.index;
      const player = players[index];

      if (!player || typeof player.getPlayerState !== 'function') return;

      const state = player.getPlayerState();
      // YT.PlayerState.PLAYING === 1, CUED === 5
      if (state === 1) {
        // Playing → pause (no reload, no restart)
        player.pauseVideo();
      } else {
        // Paused / ended / cued → play
        player.playVideo();
      }
    });
  });

  // Block right-click on video areas
  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.video-wrapper')) {
      e.preventDefault();
      showToast('Right-click is disabled on this video');
    }
  });

  // Block drag
  document.addEventListener('dragstart', (e) => {
    if (e.target.closest('.video-wrapper')) {
      e.preventDefault();
    }
  });

  // Toast helper
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>

</body>
</html>
